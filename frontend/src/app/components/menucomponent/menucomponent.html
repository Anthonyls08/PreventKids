<div class="menu-wrap">
    <mat-toolbar class="custom-toolbar">
        <a class="menu-brand" routerLink="/app/homes">
            <mat-icon aria-hidden="true">health_and_safety</mat-icon>
            PreventKids
        </a>

        <nav class="menu-nav">
            <a class="nav-link" routerLink="/app/dieta" routerLinkActive="activo">
                <mat-icon>restaurant</mat-icon>
                <span>Dieta</span>
            </a>
            <a class="nav-link" routerLink="/app/ejercicios" routerLinkActive="activo">
                <mat-icon>fitness_center</mat-icon>
                <span>Ejercicios</span>
            </a>
            <a class="nav-link" routerLink="/app/videos" routerLinkActive="activo">
                <mat-icon>smart_display</mat-icon>
                <span>Videos</span>
            </a>
            <a class="nav-link" routerLink="/app/videollamada" routerLinkActive="activo">
                <mat-icon>video_camera_front</mat-icon>
                <span>Videollamada</span>
            </a>
        </nav>

        <span class="menu-spacer"></span>

        <button matButton class="btn-gestion" aria-label="Gestion"
            [matMenuTriggerFor]="menuGestion">
            <mat-icon>settings</mat-icon>
            Gestión
            <mat-icon class="caret">arrow_drop_down</mat-icon>
        </button>

        <button matButton class="btn-logout" aria-label="Cerrar sesion"
            (click)="cerrarSesion()">
            <mat-icon>logout</mat-icon>
            Salir
        </button>
    </mat-toolbar>
