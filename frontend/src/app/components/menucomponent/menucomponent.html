<div class="menu-wrap">
    <mat-toolbar class="custom-toolbar">
        <a class="menu-brand" routerLink="/app/homes">
            <mat-icon aria-hidden="true">health_and_safety</mat-icon>
            PreventKids
        </a>

        <button matButton class="btn-rojo" aria-label="Tipo Alerta"
            [matMenuTriggerFor]="menuTipoAlerta">
            <mat-icon aria-hidden="false" aria-label="Example warning icon" fontIcon="warning"></mat-icon>
            Tipo Alerta
        </button>

        <button matButton class="btn-rojo" aria-label="Chat IA"
            [matMenuTriggerFor]="menuChatIA">
            <mat-icon aria-hidden="false" aria-label="Example chat icon" fontIcon="smart_toy"></mat-icon>
            Chat IA
        </button>

        <button matButton class="btn-rojo" aria-label="Distrito"
            [matMenuTriggerFor]="menuDistrict">
            <mat-icon aria-hidden="false" aria-label="Example city icon" fontIcon="location_city"></mat-icon>
            Distrito
        </button>

        <button matButton class="btn-rojo" [matMenuTriggerFor]="menuEspecialidad">
            <mat-icon>medical_services</mat-icon>
            Especialidad
        </button>

        <button matButton class="btn-rojo" aria-label="Roles"
            [matMenuTriggerFor]="menuRole">
            <mat-icon aria-hidden="false" aria-label="Example role icon" fontIcon="manage_accounts"></mat-icon>
            Roles
        </button>

        <button matButton class="btn-rojo" [matMenuTriggerFor]="menuTipoContenido">
            <mat-icon>movie</mat-icon>
            Tipo Contenido
        </button>

        <button matButton class="btn-rojo" [matMenuTriggerFor]="menuLimitation">
            <mat-icon>accessibility_new</mat-icon>
            Limitación Física
        </button>

        <span class="menu-spacer"></span>

        <button matButton class="btn-rojo btn-logout" aria-label="Cerrar sesion"
            (click)="cerrarSesion()">
            <mat-icon>logout</mat-icon>
            Salir
        </button>
    </mat-toolbar>

    <mat-menu #menuTipoAlerta="matMenu">
        <button mat-menu-item routerLink="/app/tipos-alerta/nuevo">
            <mat-icon>add</mat-icon>
            Registrar
        </button>
        <button mat-menu-item routerLink="/app/tipos-alerta/listar">
            <mat-icon>list</mat-icon>Listar</button>
    </mat-menu>

    <mat-menu #menuChatIA="matMenu">
        <button mat-menu-item routerLink="/app/chatia/nuevo">
            <mat-icon>add</mat-icon>
            Registrar
        </button>
        <button mat-menu-item routerLink="/app/chatia/listar">
            <mat-icon>list</mat-icon>Listar</button>
    </mat-menu>

    <mat-menu #menuDistrict="matMenu">
        <button mat-menu-item routerLink="/app/district/nuevo">
            <mat-icon>add</mat-icon>
            Registrar
        </button>
        <button mat-menu-item routerLink="/app/district/listar">
            <mat-icon>list</mat-icon>Listar</button>
    </mat-menu>

    <mat-menu #menuRole="matMenu">
        <button mat-menu-item routerLink="/app/roles/nuevo">
            <mat-icon>add</mat-icon>
            Registrar
        </button>
        <button mat-menu-item routerLink="/app/roles/listar">
            <mat-icon>list</mat-icon>Listar</button>
    </mat-menu>

    <mat-menu #menuEspecialidad="matMenu">
        <button mat-menu-item routerLink="/app/specialties/nuevo">
            <mat-icon>add</mat-icon>
            Registrar
        </button>
        <button mat-menu-item routerLink="/app/specialties/listar">
            <mat-icon>list</mat-icon>
            Listar
        </button>
    </mat-menu>

    <mat-menu #menuTipoContenido="matMenu">
        <button mat-menu-item routerLink="/app/tipos-contenido/nuevo">
            <mat-icon>add</mat-icon>
            Registrar
        </button>
        <button mat-menu-item routerLink="/app/tipos-contenido/listar">
            <mat-icon>list</mat-icon>
            Listar
        </button>
    </mat-menu>

    <mat-menu #menuLimitation="matMenu">
        <button mat-menu-item routerLink="/app/limitacion-fisica/nuevo">
            <mat-icon>add</mat-icon>
            Registrar
        </button>
        <button mat-menu-item routerLink="/app/limitacion-fisica/listar">
            <mat-icon>list</mat-icon>
            Listar
        </button>
    </mat-menu>
</div>
