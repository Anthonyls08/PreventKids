<div class="container">
    <mat-toolbar class="custom-toolbar">
        <button
        matButton
        class="btn-rojo"
        aria-label="Example icon-button with menu icon"

        <mat-icon aria-hidden="false" aria-label="Example warning icon" fontIcon="warning"></mat-icon>
        Tipo Alerta
        </button>

        <button
        matButton
        class="btn-rojo"
        aria-label="Example icon-button with menu icon"
