<div class="container">
    <mat-toolbar class="custom-toolbar">
        <button
        matButton
        class="btn-rojo"
        aria-label="Example icon-button with menu icon"
        [matMenuTriggerFor]="menuTipoAlerta">

        <mat-icon aria-hidden="false" aria-label="Example warning icon" fontIcon="warning"></mat-icon>
        Tipo Alerta
        </button>

        <button
        matButton
        class="btn-rojo"
        aria-label="Example icon-button with menu icon"
        [matMenuTriggerFor]="menuChatIA">

        <mat-icon aria-hidden="false" aria-label="Example chat icon" fontIcon="smart_toy"></mat-icon>
        Chat IA
        </button>

        <button
        matButton
        class="btn-rojo"
        aria-label="Example icon-button with menu icon"
        [matMenuTriggerFor]="menuDistrict">

        <mat-icon aria-hidden="false" aria-label="Example city icon" fontIcon="location_city"></mat-icon>
        Distrito
        </button>
    </mat-toolbar>

    <mat-menu #menuTipoAlerta="matMenu">
        <button
            mat-menu-item
            routerLink="/tipos-alerta/nuevo">
            <mat-icon>add</mat-icon>
            Registrar
        </button>
        <button mat-menu-item routerLink="/tipos-alerta/listar">
            <mat-icon>list</mat-icon>Listar</button>
    </mat-menu>

    <mat-menu #menuChatIA="matMenu">
        <button
            mat-menu-item
            routerLink="/chatia/nuevo">
            <mat-icon>add</mat-icon>
            Registrar
        </button>
        <button mat-menu-item routerLink="/chatia/listar">
            <mat-icon>list</mat-icon>Listar</button>
    </mat-menu>

    <mat-menu #menuDistrict="matMenu">
        <button
            mat-menu-item
            routerLink="/district/nuevo">
            <mat-icon>add</mat-icon>
            Registrar
        </button>
        <button mat-menu-item routerLink="/district/listar">
            <mat-icon>list</mat-icon>Listar</button>
    </mat-menu>
</div>
