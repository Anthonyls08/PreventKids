<div class="container">
  <h2 style="text-align: center">Lista de chats IA</h2>
  <div>
    <!--tabla-->
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- Pregunta Column -->
      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef>Pregunta</th>
        <td mat-cell *matCellDef="let element">{{ element.pregunta }}</td>
      </ng-container>

      <!-- Respuesta Column -->
      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef>Respuesta</th>
        <td mat-cell *matCellDef="let element">{{ element.respuesta }}</td>
      </ng-container>

      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef>Eliminar</th>
        <td mat-cell *matCellDef="let element">
          <button matButton (click)="eliminar(element.idchatIA)" class="btn-eliminar">
            <mat-icon>delete</mat-icon>
        </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="c4">
        <th mat-header-cell *matHeaderCellDef>Actualizar</th>
        <td mat-cell *matCellDef="let element">
          <button matButton [routerLink]="['/app/chatia/edits', element.idchatIA]" class="btn-editar">
            <mat-icon>edit</mat-icon>
        </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
