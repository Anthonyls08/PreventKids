<div class="container">
  <h2 style="text-align: center">Lista de chats IA</h2>

  <!-- Grilla de cards -->
  <div class="cards-grid">
    @for (chat of pagedChats(); track chat.idchatIA) {
      <mat-card class="crud-card">
        <mat-card-header>
          <mat-card-title>{{ chat.pregunta }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p class="card-desc">{{ chat.respuesta }}</p>
        </mat-card-content>
        <mat-card-actions align="end">
          <button matButton (click)="eliminar(chat.idchatIA)" class="btn-eliminar">
            <mat-icon>delete</mat-icon>
            Eliminar
          </button>
          <button matButton [routerLink]="['/app/chatia/edits', chat.idchatIA]" class="btn-editar">
            <mat-icon>edit</mat-icon>
            Editar
          </button>
        </mat-card-actions>
      </mat-card>
    } @empty {
      <p class="cards-empty">No hay chats registrados.</p>
    }
  </div>

  <!-- Paginador -->
  <mat-paginator
    class="cards-paginator"
    [length]="chats().length"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[3, 6, 9, 12]"
    [pageIndex]="pageIndex()"
    (page)="onPage($event)"
    aria-label="Paginación de chats">
  </mat-paginator>
</div>
