<div class="container">
  <h2 style="text-align: center">Lista de Limitaciones Físicas</h2>

  <div class="cards-grid">
    @for (item of pagedItems(); track item.idPhysicalLimitation) {
      <mat-card class="crud-card">
        <mat-card-header>
          <mat-card-title>{{ item.nameLimitation }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p class="card-field"><strong>Descripción:</strong> {{ item.descriptionLimitation }}</p>
          <p class="card-field"><strong>Categoría:</strong> {{ item.categoryLimitation }}</p>
        </mat-card-content>
        <mat-card-actions align="end">
          <button matButton (click)="eliminar(item.idPhysicalLimitation)" class="btn-eliminar">
            <mat-icon>delete</mat-icon>
            Eliminar
          </button>
          <button matButton [routerLink]="['/app/limitacion-fisica/edits', item.idPhysicalLimitation]" class="btn-editar">
            <mat-icon>edit</mat-icon>
            Editar
          </button>
        </mat-card-actions>
      </mat-card>
    } @empty {
      <p class="cards-empty">No hay limitaciones físicas registradas.</p>
    }
  </div>

  <mat-paginator
    class="cards-paginator"
    [length]="items().length"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[3, 6, 9, 12]"
    [pageIndex]="pageIndex()"
    (page)="onPage($event)"
    aria-label="Paginación de limitaciones físicas">
  </mat-paginator>
</div>
