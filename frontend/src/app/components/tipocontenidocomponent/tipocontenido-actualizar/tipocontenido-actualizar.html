<div class="container">
  <div style="text-align: center; margin: 3%">
    <h2>Actualizar Tipo de Contenido</h2>
  </div>

  <div style="text-align: center">
    <form [formGroup]="form" (submit)="aceptar()">

      <mat-form-field class="example-full-width">
        <mat-label>Id</mat-label>
        <input matInput formControlName="codigo" readonly="true" />
      </mat-form-field>
      <br />

      <mat-form-field class="example-full-width">
        <mat-label>Nombre</mat-label>
        <mat-select formControlName="nombre">
          @for (t of tipos; track t) {
            <mat-option [value]="t">{{ t }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <br />

      <mat-form-field class="example-full-width">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="descripcion" />
      </mat-form-field>
      <br />

      <mat-form-field class="example-full-width">
        <mat-label>Duración</mat-label>
        <input matInput type="number" formControlName="duracion" />
      </mat-form-field>
      <br />

      <div>
        <button mat-raised-button color="primary" type="submit">Actualizar</button>
      </div>

    </form>
  </div>
</div>
