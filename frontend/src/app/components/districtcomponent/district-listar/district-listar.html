<div class="container">
  <h2 style="text-align: center">Lista de Distritos</h2>

  <div class="cards-grid">
    @for (item of pagedItems(); track item.idDistrict) {
      <mat-card class="crud-card">
        <mat-card-header>
          <mat-card-title>{{ item.nameDistrict }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p class="card-field"><strong>Departamento:</strong> {{ item.nameDepartment }}</p>
          <p class="card-field"><strong>Zona:</strong> {{ item.zone }}</p>
          <p class="card-field"><strong>Ubigeo:</strong> {{ item.ubigeo }}</p>
        </mat-card-content>
        <mat-card-actions align="end">
          <button matButton (click)="eliminar(item.idDistrict)" class="btn-eliminar">
            <mat-icon>delete</mat-icon>
            Eliminar
          </button>
          <button matButton [routerLink]="['/app/district/actualizar', item.idDistrict]" class="btn-editar">
            <mat-icon>edit</mat-icon>
            Editar
          </button>
        </mat-card-actions>
      </mat-card>
    } @empty {
      <p class="cards-empty">No hay distritos registrados.</p>
    }
  </div>

  <mat-paginator
    class="cards-paginator"
    [length]="items().length"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[3, 6, 9, 12]"
    [pageIndex]="pageIndex()"
    (page)="onPage($event)"
    aria-label="Paginación de distritos">
  </mat-paginator>
</div>
