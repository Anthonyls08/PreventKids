<div class="container">
  <h2 style="text-align: center">Lista de roles</h2>

  <div class="cards-grid">
    @for (item of pagedItems(); track item.idRole) {
      <mat-card class="crud-card">
        <mat-card-header>
          <mat-card-title>{{ item.nombre }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p class="card-desc">{{ item.descripcion }}</p>
        </mat-card-content>
        <mat-card-actions align="end">
          <button matButton (click)="eliminar(item.idRole)" class="btn-eliminar">
            <mat-icon>delete</mat-icon>
            Eliminar
          </button>
          <button matButton [routerLink]="['/app/roles/edits', item.idRole]" class="btn-editar">
            <mat-icon>edit</mat-icon>
            Editar
          </button>
        </mat-card-actions>
      </mat-card>
    } @empty {
      <p class="cards-empty">No hay roles registrados.</p>
    }
  </div>

  <mat-paginator
    class="cards-paginator"
    [length]="items().length"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[3, 6, 9, 12]"
    [pageIndex]="pageIndex()"
    (page)="onPage($event)"
    aria-label="Paginación de roles">
  </mat-paginator>
</div>
