<div class="container">
  <div style="text-align: center; margin: 3%">
    <h2>Actualizar Alerta</h2>
  </div>

  <div style="text-align: center">
    <form [formGroup]="form" (submit)="aceptar()">

      <mat-form-field class="example-full-width">
        <mat-label>ID</mat-label>
        <input
          matInput
          formControlName="idAlert"
          readonly="true">
      </mat-form-field>

      <br>

      <mat-form-field class="example-full-width">
        <mat-label>Fecha de generación</mat-label>
        <input
          matInput
          type="date"
          formControlName="generationdate">
      </mat-form-field>

      <br>

      <mat-form-field>
        <mat-label>Leída</mat-label>
        <mat-select formControlName="leida">
          <mat-option [value]="true">Sí</mat-option>
          <mat-option [value]="false">No</mat-option>
        </mat-select>
      </mat-form-field>

      <br>

      <mat-form-field>
        <mat-label>Tipo de alerta</mat-label>
        <mat-select formControlName="tipoalert">
          @for (item of listaTipos; track item.idTipoalerta) {
            <mat-option [value]="item.idTipoalerta">
              {{ item.nombre }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

      <br>

      <mat-form-field>
        <mat-label>Medición</mat-label>
        <mat-select formControlName="medicion">
          @for (item of listaMediciones; track item.idMedicion) {
            <mat-option [value]="item.idMedicion">
              Medición #{{ item.idMedicion }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

      <br>

      <div class="form-acciones">
        <button matButton type="submit" class="btn-form">
          <mat-icon>save</mat-icon> Actualizar
        </button>

        <button matButton type="button" class="btn-form" routerLink="/app/alertas/listar">
          <mat-icon>cancel</mat-icon> Cancelar
        </button>
      </div>

    </form>
  </div>
</div>
