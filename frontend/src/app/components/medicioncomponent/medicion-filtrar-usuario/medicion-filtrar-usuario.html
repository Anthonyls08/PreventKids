<div class="chart-container">
  <div class="report-volver">
    <a matButton class="btn-form" routerLink="/app/reportes">
      <mat-icon>arrow_back</mat-icon>
      Regresar
    </a>
  </div>
  <h2 class="chart-title">Mediciones filtradas por hijo</h2>

  <form class="chart-form" (ngSubmit)="consultar()">
    <div class="campo">
      <label for="idHijo">ID del hijo</label>
      <input id="idHijo" name="idHijo" type="number" min="1" [(ngModel)]="idHijo" />
    </div>
    <button type="submit">Filtrar</button>
  </form>

  <div class="chart-wrapper">
    @if (hasData) {
      <div class="chart-wrapper chart-bar">
        <canvas
          baseChart
          [datasets]="chartData"
          [labels]="chartLabels"
          [options]="chartOptions"
          [legend]="chartLegend"
          [type]="chartType"
        >
        </canvas>
      </div>
    }

    @if (buscado && !hasData) {
      <div class="no-data">
        <mat-icon class="no-data-icon">info_outline</mat-icon>
        <p class="no-data-message">Este niño no tiene mediciones registradas.</p>
      </div>
    }
  </div>

  @if (hasData) {
    <p class="chart-total">Total de mediciones del niño: <strong>{{ total }}</strong></p>
  }
</div>
