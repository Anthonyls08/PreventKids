spring.application.name=PreventKids
# Render (y cualquier PaaS) inyecta el puerto por la variable PORT; en local usa 8080
server.port=${PORT:8080}
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Evita el 400 "Cannot map null into type int": trata null como valor por
# defecto (0/false) al deserializar primitivos en objetos anidados (FK).
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.datasource.driver-class-name=org.postgresql.Driver
# En local usa los valores por defecto; en la nube se inyectan por variables de entorno.
# DB_SSL vacio en local; en Koyeb/Neon se pone: ?sslmode=require
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:PreventKids}${DB_SSL:}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:moca}
jwt.
# Clave de la API de Gemini (Google AI Studio, capa gratuita) para el Chat IA.
# Se obtiene gratis en https://aistudio.google.com/apikey (sin tarjeta).
# Configurar la variable de entorno GEMINI_API_KEY (no commitear la clave).
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
